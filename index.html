<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKfrgUe0feI07W77_gDGd1NCfUZFbpx2Vu4zeu_XttfKnK5zKxn2AjYuXgXOQ_PvoTSw/exec";

const form = document.getElementById("dynexForm");
const statusBox = document.getElementById("statusBox");
const submitBtn = document.getElementById("submitBtn");
const fileInput = document.getElementById("receipt");
const fileMeta = document.getElementById("fileMeta");

const onlyDigits = (value) => (value || "").replace(/\D+/g, "");

function showStatus(message, type) {
  statusBox.className = "status show " + type;
  statusBox.textContent = message;
}

function sanitizeNumericFields() {
  const phone = form.elements.ownerPhone;
  const year = form.elements.year;
  const serial = form.elements.serialNumber;
  const mileage = form.elements.mileage;

  phone.value = onlyDigits(phone.value).slice(0, 15);
  year.value = onlyDigits(year.value).slice(0, 4);
  serial.value = onlyDigits(serial.value).slice(0, 18);
  mileage.value = onlyDigits(mileage.value).slice(0, 12);
}

["ownerPhone", "year", "serialNumber", "mileage"].forEach((name) => {
  form.elements[name].addEventListener("input", sanitizeNumericFields);
});

fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) {
    fileMeta.textContent = "รองรับไฟล์ JPG, PNG, WEBP และ PDF";
    return;
  }
  const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
  fileMeta.textContent = `เลือกไฟล์แล้ว: ${file.name} (${sizeMB} MB)`;
});

function applyQueryStringPrefill() {
  const params = new URLSearchParams(window.location.search);
  const mapping = {
    "entry.912384794": "email",
    "entry.2092238618": "shopName",
    "entry.1176655828": "province",
    "entry.545221185": "ownerName",
    "entry.106097018": "ownerPhone",
    "entry.304710007": "brand",
    "entry.1140837996": "model",
    "entry.236465467": "year",
    "entry.326773066": "horsepower",
    "entry.1929733376": "batteryModel",
    "entry.1793562486": "serialNumber",
    "entry.2109138769": "installedCarModel",
    "entry.1556369182": "mileage",
    "entry.1313741841": "installDate",
    "email": "email",
    "shopName": "shopName",
    "province": "province",
    "ownerName": "ownerName",
    "ownerPhone": "ownerPhone",
    "brand": "brand",
    "model": "model",
    "year": "year",
    "horsepower": "horsepower",
    "batteryModel": "batteryModel",
    "serialNumber": "serialNumber",
    "installedCarModel": "installedCarModel",
    "mileage": "mileage",
    "installDate": "installDate"
  };

  params.forEach((value, key) => {
    const targetName = mapping[key];
    if (targetName && form.elements[targetName]) {
      form.elements[targetName].value = value;
      form.elements[targetName].dispatchEvent(new Event("change", { bubbles: true }));
    }
  });

  sanitizeNumericFields();

  const autoSubmit = params.get("autosubmit");
  if (autoSubmit === "1") {
    showStatus("ระบบพบ autosubmit=1 แต่ยังไม่ส่งอัตโนมัติ เพราะต้องแนบไฟล์ใบเสร็จก่อน", "error");
  }
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || "");
      const base64 = result.includes(",") ? result.split(",")[1] : result;
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function validateForm() {
  sanitizeNumericFields();

  if (!form.reportValidity()) return false;

  if (!/^[0-9]{9,15}$/.test(form.elements.ownerPhone.value)) {
    showStatus("เบอร์ติดต่อกรอกได้เฉพาะตัวเลข 9-15 หลัก", "error");
    form.elements.ownerPhone.focus();
    return false;
  }

  if (!/^[0-9]{4}$/.test(form.elements.year.value)) {
    showStatus("ปีรถต้องเป็นตัวเลข 4 หลัก", "error");
    form.elements.year.focus();
    return false;
  }

  if (!/^[0-9]{1,18}$/.test(form.elements.serialNumber.value)) {
    showStatus("Serial Numbers ต้องเป็นตัวเลขเท่านั้นและไม่เกิน 18 หลัก", "error");
    form.elements.serialNumber.focus();
    return false;
  }

  if (!/^[0-9]{1,12}$/.test(form.elements.mileage.value)) {
    showStatus("เลขไมล์ต้องเป็นตัวเลขเท่านั้น", "error");
    form.elements.mileage.focus();
    return false;
  }

  const file = fileInput.files && fileInput.files[0];
  if (!file) {
    showStatus("กรุณาแนบใบเสร็จก่อนส่งข้อมูล", "error");
    return false;
  }

  return true;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!validateForm()) return;

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE")) {
    showStatus("ยังไม่ได้ตั้งค่า APPS_SCRIPT_URL ในไฟล์ index.html", "error");
    return;
  }

  const file = fileInput.files[0];
  const submitText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = "กำลังอัปโหลด...";

  try {
    showStatus("กำลังอัปโหลดใบเสร็จและบันทึกข้อมูล กรุณารอสักครู่...", "success");

    const payload = {
      email: form.elements.email.value.trim(),
      shopName: form.elements.shopName.value.trim(),
      province: form.elements.province.value.trim(),
      ownerName: form.elements.ownerName.value.trim(),
      ownerPhone: form.elements.ownerPhone.value.trim(),
      brand: form.elements.brand.value.trim(),
      model: form.elements.model.value.trim(),
      year: form.elements.year.value.trim(),
      horsepower: form.elements.horsepower.value,
      batteryModel: form.elements.batteryModel.value,
      serialNumber: form.elements.serialNumber.value.trim(),
      installedCarModel: form.elements.installedCarModel.value.trim(),
      mileage: form.elements.mileage.value.trim(),
      installDate: form.elements.installDate.value,
      fileName: file.name,
      mimeType: file.type || "application/octet-stream",
      fileBase64: await fileToBase64(file)
    };

    const response = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "ส่งข้อมูลไม่สำเร็จ");
    }

    showStatus("ได้รับข้อมูลเรียบร้อยแล้ว", "success");
    alert("ได้รับข้อมูลเรียบร้อยแล้ว");
    form.reset();
    fileMeta.textContent = "รองรับไฟล์ JPG, PNG, WEBP และ PDF";

    document.querySelectorAll("select.control").forEach((select) => {
      select.dispatchEvent(new Event("change", { bubbles: true }));
    });
  } catch (error) {
    console.error(error);
    showStatus("ส่งข้อมูลไม่สำเร็จ: " + (error.message || "กรุณาตรวจสอบ Apps Script และสิทธิ์การเข้าถึง"), "error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = submitText;
  }
});

applyQueryStringPrefill();
</script>
